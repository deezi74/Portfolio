plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.ronnielynch.luna"
    compileSdk 34
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.ronnielynch.luna"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Real phones, not emulators - this is what a downloaded local GGUF model needs.
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    // Fetches and compiles llama.cpp itself (see comments in CMakeLists.txt) - only needed
    // for the local/on-device model provider. First build needs internet access and takes a
    // while; Gradle/CMake caches it after that.
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    // Everything except the local on-device model path (LocalLlm.kt, com.arm.aichat, vendored
    // from llama.cpp's own examples/llama.android) uses the Android SDK directly - no libraries.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
