plugins {
    id 'com.android.application'
}

android {
    namespace "com.ronnielynch.luna"
    compileSdk 34

    defaultConfig {
        applicationId "com.ronnielynch.luna"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No third-party libraries required - MainActivity uses the Android SDK
    // (HttpURLConnection, org.json, TextToSpeech, SpeechRecognizer) directly.
}
